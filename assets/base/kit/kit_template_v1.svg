<?xml version="1.0" encoding="UTF-8"?>
<!-- Football Madness forma deseni sablonu. viewBox 400x500. Renkler: #FF0000 ana, #00FF00 ikinci, #0000FF ucuncu (oyunda oyuncunun sectigi renkle degistirilir).
     Forma silueti oyunda kirpilir; deseni tum alana ciz. Metin, bitmap, filtre yok. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" fill="#FF0000"/>
  <!-- desen buraya: ornek yatay cubuk -->
  <g fill="#00FF00"><rect y="90" width="400" height="50"/><rect y="190" width="400" height="50"/><rect y="290" width="400" height="50"/><rect y="390" width="400" height="50"/></g>
  <!-- siluet rehberi (teslimde silinebilir, zararsiz) -->
  <path d="M120 40 L170 20 Q200 40 230 20 L280 40 L360 90 L330 170 L290 150 L290 470 L110 470 L110 150 L70 170 L40 90 Z" fill="none" stroke="#000000" stroke-opacity=".25" stroke-width="2"/>
</svg>
