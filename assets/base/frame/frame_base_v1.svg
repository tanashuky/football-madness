  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D2A23"/><stop offset="1" stop-color="#0F1713"/></linearGradient></defs>
  <rect x="1" y="1" width="238" height="298" rx="14" fill="url(#bg)" stroke="#2A3A33" stroke-width="2"/>
  <rect x="8" y="8" width="224" height="284" rx="10" fill="none" stroke="#2A3A33" stroke-opacity=".6" stroke-width="1"/>
