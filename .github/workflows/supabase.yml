# Supabase deploy: server/ ya da motor degisince Edge Function'i yayinlar; migrasyonlar server/supabase/migrations/ altindan uygulanir.
name: supabase-deploy
on:
  push:
    branches: [main]
    paths: ['server/**', 'prototype/src/engine.ts', '.github/workflows/supabase.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hukoepbvntsksefzguxl
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Motoru fonksiyona kopyala (tek kaynak)
        run: cp prototype/src/engine.ts server/supabase/functions/verify-match/engine.ts
      - name: Edge Function deploy
        working-directory: server
        run: supabase functions deploy verify-match --project-ref "$PROJECT_REF" --yes
      - name: Migrasyonlar (varsa)
        if: ${{ env.SUPABASE_DB_PASSWORD != '' }}
        working-directory: server
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --yes
      # Giris e-postasi: baglanti yerine (ek olarak) 6 haneli kod. Ana ekrana eklenen uygulama Safari'den ayri depolama kullanir;
      # baglanti Safari'de acildigi icin oturum uygulamaya gecmez, kod ise uygulamanin icinde yazilir.
      - name: Giris e-postasi sablonu (kodlu)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          html = open('server/supabase/templates/otp.html').read()
          body = json.dumps({
            'mailer_subjects_magic_link': 'Football Madness giriş kodun',
            'mailer_templates_magic_link_content': html,
            'mailer_subjects_confirmation': 'Football Madness giriş kodun',
            'mailer_templates_confirmation_content': html,
          }).encode()
          req = urllib.request.Request('https://api.supabase.com/v1/projects/%s/config/auth' % os.environ['PROJECT_REF'], data=body, method='PATCH',
            headers={'Authorization': 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN'], 'Content-Type': 'application/json', 'User-Agent': 'fm-deploy'})
          try:
            r = urllib.request.urlopen(req); d = json.load(r)
            print('SABLON OK', r.status, 'otp_length=', d.get('mailer_otp_length'), 'kod var mi:', '{{ .Token }}' in (d.get('mailer_templates_magic_link_content') or ''))
          except urllib.error.HTTPError as e:
            print('SABLON HATA', e.code, e.read().decode()[:300]); raise SystemExit(1)
          PY
