# Supabase ücretsiz projesi 7 gün istek almazsa uyutulur; her gün bir okuma isteğiyle uyanık tutulur.
name: supabase-keepalive
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Veri tabanına küçük bir istek (anon anahtar, RLS: boş sonuç yeter)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_8m8DORbwGcE-tiWPMfGV2g_tg3k2TEU" \
            -H "Authorization: Bearer sb_publishable_8m8DORbwGcE-tiWPMfGV2g_tg3k2TEU" \
            "https://hukoepbvntsksefzguxl.supabase.co/rest/v1/saves?select=profile&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
