<div id="app">
  <div class="bar"><button class="back" id="aBack" aria-label="Geri">‹</button><div class="ttl" id="aTitle">Football <span>Madness</span></div><button class="ico" id="aHome" title="Ana menü">⌂</button><button class="ico" id="aFriends" title="Arkadaşlar (demoda yok)">☺ 0</button><button class="ico" id="aSettings" title="Ayarlar">⚙</button></div>
  <div class="body" id="aBody"></div>
  <div class="foot" id="aFoot" hidden></div>
  <div class="tabs3" id="aTabs" hidden></div>
</div>
<script>
// ---------- Uygulama katmani (Dilim 1 demo) ----------
// Kayit: localStorage. Ekranlar: giris (misafir) -> kulup kurulumu -> ana menu -> Mac Modu / Solo Lig / Takim / Ayarlar; mac odasi -> mac -> rapor.
const APP = { key: 'fm.demo.v1', db: null, screen: 'login', stack: [], ctx: {} };
const DEF_SETTINGS = { keys: 'arrows', assistP: 0, assistS: 1, autoSwitch: true, ball: 1.4, names: 'auto', cam: 'full', mode: 'team', minutes: 10 };
function dbLoad() { try { APP.db = JSON.parse(localStorage.getItem(APP.key)) || null; } catch (e) { APP.db = null; } if (!APP.db) APP.db = { account: null, settings: { ...DEF_SETTINGS }, team: null, solo: null, roster: null, mm: { elo: 1000, last: null, played: 0 } }; APP.db.settings = { ...DEF_SETTINGS, ...(APP.db.settings || {}) }; }
function dbSave() { APP.db.updatedAt = Date.now(); try { localStorage.setItem(APP.key, JSON.stringify(APP.db)); } catch (e) {} CLOUD.schedulePush(); }
// ---------- Bulut (Dilim 2b): hesap + bulut kayit. Supabase anahtari verilince calisir; yoksa her sey yerelde kalir. ----------
// Yapilandirma: FM_CLOUD sabiti (derlemede doldurulur) ya da localStorage 'fm.cloud' ({url, anon}) ile gecersiz kilinir.
const FM_CLOUD = { url: '__SUPABASE_URL__', anon: '__SUPABASE_ANON__', providers: '__SUPABASE_PROVIDERS__' }; // providers: 'email' | 'email,google,apple' (saglayici Supabase'de acilinca)
const CLOUD = {
  sb: null, user: null, state: 'off', // off | loading | ready | error
  cfg() { try { const o = JSON.parse(localStorage.getItem('fm.cloud') || 'null'); if (o && o.url && o.anon) return o; } catch (e) {} return FM_CLOUD.url && !FM_CLOUD.url.startsWith('__') ? FM_CLOUD : null; },
  async init() {
    const cfg = this.cfg(); if (!cfg) { this.state = 'off'; return; }
    this.state = 'loading';
    try {
      const mod = window.__supabaseMock ? window.__supabaseMock : await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm');
      this.sb = mod.createClient(cfg.url, cfg.anon, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
      const { data } = await this.sb.auth.getSession();
      this.user = data?.session?.user ?? null;
      this.sb.auth.onAuthStateChange((_ev, session) => { const was = !!this.user; this.user = session?.user ?? null; if (!was && this.user) this.afterSignIn(); if (APP.screen === 'settings' || APP.screen === 'login') render(); });
      this.state = 'ready';
      if (this.user) await this.pull();
    } catch (e) { console.error('bulut', e); this.state = 'error'; }
    if (APP.screen === 'login' || APP.screen === 'settings') render();
  },
  label() { if (!this.user) return 'Bağlı değil'; const p = this.user.app_metadata?.provider || 'e-posta'; return `${this.user.email || this.user.id.slice(0, 8)} · ${p === 'email' ? 'e-posta' : p}`; },
  async signInOAuth(provider) { if (!this.sb) return; const { error } = await this.sb.auth.signInWithOAuth({ provider, options: { redirectTo: location.origin + location.pathname } }); if (error) toast('Giriş hatası: ' + error.message); },
  async signInEmail(email) { if (!this.sb) return; const { error } = await this.sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } }); toast(error ? 'Hata: ' + error.message : 'Giriş bağlantısı e-postana gönderildi'); },
  async signOut() { if (!this.sb) return; await this.sb.auth.signOut(); this.user = null; toast('Çıkış yapıldı; kayıt bu cihazda duruyor'); render(); },
  // ilk giris: bulutta kayit varsa ve yereldekinden yeniyse (ya da yerel hesap yoksa) bulut kazanir; yoksa yerel buluta yazilir
  async afterSignIn() { const r = await this.pull(); if (!r) await this.push(); toast('Hesap bağlandı: ' + this.label()); },
  async pull() {
    if (!this.sb || !this.user) return false;
    const { data, error } = await this.sb.from('saves').select('data, updated_at').eq('profile', this.user.id).maybeSingle();
    if (error) { console.error(error); return false; }
    if (!data) return false;
    const cloudAt = new Date(data.updated_at).getTime(), localAt = APP.db.updatedAt || 0;
    if (!APP.db.account || cloudAt > localAt) { APP.db = { ...data.data, updatedAt: cloudAt }; try { localStorage.setItem(APP.key, JSON.stringify(APP.db)); } catch (e) {} ensureRoster(); if (APP.screen === 'login' && APP.db.account) go('home', {}, false); else render(); toast('Bulut kaydı yüklendi'); return true; }
    return true;
  },
  _timer: null,
  schedulePush() { if (!this.sb || !this.user) return; clearTimeout(this._timer); this._timer = setTimeout(() => this.push(), 1500); },
  async push() {
    if (!this.sb || !this.user) return;
    const { error } = await this.sb.from('saves').upsert({ profile: this.user.id, data: APP.db, updated_at: new Date(APP.db.updatedAt || Date.now()).toISOString() });
    if (error) { console.error('push', error); this.lastErr = error.message; } else this.lastPush = Date.now();
    if (APP.screen === 'settings') { const el = $('cloudStatus'); if (el) el.textContent = this.statusText(); }
  },
  // sunucu dogrulamasi: kayit Edge Function'a gider, ayni motor orada kosar; sonuc rapor ekranina yazilir
  lastVerify: null,
  async verifyMatch(rep, c) {
    this.lastVerify = null;
    if (!this.sb || !this.user) return;
    this.lastVerify = { state: 'pending' }; const t0 = performance.now();
    try {
      const { data, error } = await this.sb.functions.invoke('verify-match', { body: { kind: c?.kind === 'solo' ? 'solo_league' : 'friendly', minutes: c?.minutes || APP.db.settings.minutes, side: c?.home === false ? 1 : 0, opp: c?.tpl || null, replay: rep } });
      let msg = error ? (error.message || String(error)) : '';
      if (error && error.context && typeof error.context.text === 'function') { try { const body = await error.context.text(); if (body) msg += ' — ' + body.slice(0, 300); msg += ` (HTTP ${error.context.status})`; } catch (e2) {} }
      this.lastVerify = error ? { state: 'error', msg } : { state: 'done', ok: !!data?.ok, score: data?.score, ms: data?.ms, total: Math.round(performance.now() - t0), id: data?.id };
    } catch (e) { this.lastVerify = { state: 'error', msg: e.message || String(e) }; }
    const el = $('rServer'); if (el) el.textContent = this.verifyText();
  },
  verifyText() { const v = this.lastVerify; if (!this.user) return 'Sunucu doğrulaması için hesap gerekli.'; if (!v) return ''; if (v.state === 'pending') return 'Sunucu doğruluyor…'; if (v.state === 'error') return 'Sunucu doğrulaması başarısız: ' + v.msg; return v.ok ? `Sunucu doğruladı ✓ (${v.score?.join('–')}, sunucu ${v.ms} ms, toplam ${v.total} ms)` : `Sunucu reddetti ✗ (sunucu skoru ${v.score?.join('–')})`; },
  statusText() { if (this.state === 'off') return 'Bulut yapılandırılmadı (demo: kayıt yalnız bu cihazda).'; if (this.state === 'loading') return 'Bağlanıyor…'; if (this.state === 'error') return 'Bulut hatası; kayıt yerelde.'; if (!this.user) return 'Giriş yapılmadı; kayıt yalnız bu cihazda.'; return `${this.label()} · ${this.lastErr ? 'son eşitleme hatası: ' + this.lastErr : this.lastPush ? 'eşitlendi ' + new Date(this.lastPush).toLocaleTimeString('tr-TR') : 'eşitleniyor…'}`; },
};
function authButtons() {
  if (CLOUD.state === 'off') return '';
  if (CLOUD.user) return `<p class="muted">Hesap: ${esc(CLOUD.label())} · <a href="#" id="switchAcc" style="color:var(--chalk)">Hesap değiştir</a></p>`;
  const prov = (CLOUD.cfg() || {}).providers || (String(FM_CLOUD.providers || '').startsWith('__') ? 'email' : FM_CLOUD.providers);
  return `<div class="row" style="justify-content:center">${prov.includes('google') ? '<button class="btn" data-oauth="google">Google ile</button>' : ''}${prov.includes('apple') ? '<button class="btn" data-oauth="apple">Apple ile</button>' : ''}</div>
    <div class="row" style="justify-content:center;margin-top:6px"><input id="emailIn" type="email" placeholder="e-posta" style="background:#0b100e;color:var(--chalk);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:14px var(--font-body)"><button class="btn" id="emailGo">Bağlantı gönder</button></div>`;
}
function bindAuth() { const sw = $('switchAcc'); if (sw) sw.onclick = async (e) => { e.preventDefault(); if (!confirm('Bu hesaptan çıkılsın mı? Kayıt bulutta kalır; başka hesapla girebilirsin.')) return; await CLOUD.signOut(); go('login', {}, false); }; for (const b of document.querySelectorAll('[data-oauth]')) b.onclick = () => CLOUD.signInOAuth(b.dataset.oauth); const eg = $('emailGo'); if (eg) eg.onclick = () => { const v = $('emailIn').value.trim(); if (v) CLOUD.signInEmail(v); }; }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (id) => document.getElementById(id);
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('app').appendChild(t); setTimeout(() => t.remove(), 2200); }

// --- takim verisi ---
// kullanicinin kadrosu: makeTeam iskeleti + oyuncu basina deterministik GG sapmasi (kadro ekrani icin cesitlilik)
function mkSquad(club, base, names) {
  const t = makeTeam(club.name, club.short, base, { formation: club.formation || '4-3-3' }, names, club.color, club.color2);
  const off = [3, 1, 4, 2, -2, 5, 0, 3, -1, 6, 4, -3, -4, -2, -1, 0, -5, -2];
  t.players.forEach((p, i) => { p.gg = base + off[i % off.length]; p.age = 21 + ((i * 7) % 13); });
  t.bench.forEach((p, i) => { p.gg = base + off[(i + 11) % off.length]; p.age = 19 + ((i * 5) % 14); });
  return t;
}
// Kullanicinin kadrosu: kalici liste (db.roster, 18 futbolcu). Her futbolcunun sabit bir ic kimligi (id) var; forma numarasi
// yalnizca bir ETIKETTIR (1-99, takim icinde benzersiz, futbolcu kartindan degistirilebilir) ve dizilimde hicbir rolu yoktur.
// Formasyon slotlarin mevkisini verir; lineup = 11 futbolcu id'si (slot sirasinda); gorev kartlari id ile tutulur.
// Motor icinde kimlik forma numarasidir (takimda benzersiz oldugu garanti), uygulama maca cikarken id -> numara cevirir.
// 1 Kasim hatasi: kadro formasyona gore uretiliyor ve numara kimlik sayiliyordu; 5-3-2'de numaralar degisince oyuncu NaN olup herkesi yok etti.
function ensureRoster() {
  const db = APP.db;
  if (!db.roster || !Array.isArray(db.roster) || db.roster.length < 11) {
    const club = db.account.club;
    const base = mkSquad({ ...club, formation: '4-3-3' }, club.gg || 62, NAMES_A);
    db.roster = [...base.players, ...base.bench].map((p, i) => ({ id: 'p' + (i + 1), num: p.num, name: p.name, natPos: p.pos, gg: p.gg, age: p.age, traits: p.traits || [], fatigue: p.fatigue ?? 20 }));
    // eski kayit: numaraya gore tutulan dizilis ve gorev kartlari kimlige cevrilir
    const tt = db.team;
    if (tt && Array.isArray(tt.lineup) && tt.lineup.some((n) => typeof n === 'number')) { tt.lineup = tt.lineup.map((n) => (typeof n === 'number' ? db.roster.find((p) => p.num === n)?.id : n)).filter(Boolean); if (tt.lineup.length === 11 && FORM_POS[tt.formation]) tt.lineup = defaultLineup(tt.lineup.map((id) => db.roster.find((p) => p.id === id)), FORM_POS[tt.formation]); }
    if (tt && tt.duties) { const d2 = {}; for (const [k, v] of Object.entries(tt.duties)) { if (String(k).startsWith('p')) { d2[k] = v; continue; } const p = db.roster.find((q) => q.num === +k); if (p) d2[p.id] = v; } tt.duties = d2; }
    dbSave();
  }
  return db.roster;
}
const rosterById = () => Object.fromEntries(ensureRoster().map((p) => [p.id, p]));
// forma numarasi degistir: 1-99 tam sayi, takimda benzersiz
function setShirtNumber(id, num) {
  const roster = ensureRoster(); num = Math.round(+num);
  if (!Number.isFinite(num) || num < 1 || num > 99) return 'Numara 1 ile 99 arasında olmalı';
  if (roster.some((p) => p.id !== id && p.num === num)) return `${num} numara ${roster.find((p) => p.num === num).name}'de`;
  const p = roster.find((q) => q.id === id); if (!p) return 'Futbolcu bulunamadı';
  p.num = num; dbSave(); return null;
}
// varsayilan diziliş: her slota dogal mevkisi uyan en guclu bos oyuncu, kalan slotlara en guclu kalanlar (numaradan bagimsiz)
function defaultLineup(roster, slots) {
  const free = new Set(roster.map((p) => p.id)); const out = new Array(slots.length).fill(null);
  const pick = (pred) => { let best = null; for (const p of roster) if (free.has(p.id) && pred(p) && (!best || p.gg > best.gg)) best = p; if (best) free.delete(best.id); return best ? best.id : null; };
  slots.forEach((sp, i) => { out[i] = pick((p) => p.natPos === sp); });
  const near = { FB: ['W', 'CB'], CB: ['DM', 'FB'], DM: ['CM', 'CB'], CM: ['DM', 'W'], W: ['CM', 'ST', 'FB'], ST: ['W', 'CM'], GK: [] };
  slots.forEach((sp, i) => { if (out[i] === null) out[i] = pick((p) => p.natPos !== 'GK' && (near[sp] || []).includes(p.natPos)); });
  slots.forEach((sp, i) => { if (out[i] === null) out[i] = pick((p) => sp === 'GK' ? p.natPos === 'GK' : p.natPos !== 'GK'); });
  slots.forEach((sp, i) => { if (out[i] === null) out[i] = pick(() => true); });
  return out;
}
// formasyon degisince secili 11 korunur, slotlara dogal mevkiye gore yeniden dagitilir (bek stoper slotuna dusmesin)
function reslot(ids, slots) {
  const roster = rosterById(); const chosen = ids.map((id) => roster[id]).filter(Boolean);
  if (chosen.length !== slots.length) return ids;
  return defaultLineup(chosen, slots);
}
function userTeamIn() {
  const db = APP.db, club = db.account.club, tt = db.team;
  if (!FORMATIONS[tt.formation]) tt.formation = '4-3-3';
  if (tt.formationAtt && !FORMATIONS[tt.formationAtt]) delete tt.formationAtt;
  const t = mkSquad({ ...club, formation: tt.formation }, club.gg || 62, NAMES_A);
  const roster = ensureRoster();
  const slots = FORM_POS[tt.formation];
  const byId = Object.fromEntries(roster.map((p) => [p.id, p]));
  // diziliş dogrulama: 11 benzersiz kimlik, hepsi kadroda; degilse varsayilana don (numaranin dizilimde rolu yok)
  const lu = tt.lineup;
  const valid = Array.isArray(lu) && lu.length === 11 && new Set(lu).size === 11 && lu.every((id) => byId[id]);
  if (!valid) { tt.lineup = defaultLineup(roster, slots); dbSave(); }
  // numara benzersizligi (eski kayit / bozulma): cakisanlara bos numara ver
  { const used = new Set(); for (const p of roster) { if (used.has(p.num) || !Number.isFinite(p.num) || p.num < 1 || p.num > 99) { let n = 1; while (used.has(n) || roster.some((q) => q !== p && q.num === n)) n++; p.num = n; } used.add(p.num); } }
  const mk = (p, pos) => ({ num: p.num, name: p.name, pos, natPos: p.natPos, gg: p.gg, age: p.age, traits: p.traits, fatigue: p.fatigue, id: p.id });
  const xi = tt.lineup.map((id, i) => mk(byId[id], slots[i]));
  const rest = roster.filter((p) => !tt.lineup.includes(p.id)).sort((a, b) => (a.natPos === 'GK' ? -1 : b.natPos === 'GK' ? 1 : 0)).map((p) => mk(p, p.natPos));
  t.players = xi; t.bench = rest;
  // gorev kartlari: kimlikten o anki forma numarasina (motor numara ile calisir)
  const duties = {}; for (const [id, d] of Object.entries(tt.duties || {})) { const p = byId[id]; if (p) duties[p.num] = d; }
  const sh = userShapes(tt);
  const rotations = (tt.rotations || []).map((c) => c.filter((id) => tt.lineup.includes(id) && byId[id]).map((id) => byId[id].num)).filter((c) => c.length >= 2);
  t.tactic = { ...tt.tactic, doctrine: tt.doctrine, shapeDef: sh.def, shapeAtt: sh.att, rotations: rotations.length ? rotations : undefined };
  t.mainTactic = { ...tt.tactic, doctrine: tt.doctrine };
  t.duties = duties;
  t.rules = (tt.rules || []).map((id) => RULE_TEMPLATES.find((r) => r.id === id)).filter(Boolean);
  t.U = 60; t.T = 60; t.F = 60; t.M = 70;
  return t;
}

const DIFF = [['1', 'Amatör'], ['2', 'Yarı profesyonel'], ['3', 'Profesyonel'], ['4', 'Dünya klası'], ['5', 'Efsane']];
function botTeamIn(tpl, diff, names) {
  const t = mkSquad({ name: tpl.name, short: tpl.short, color: tpl.color, color2: tpl.color2, formation: tpl.formation }, tpl.gg, names || NAMES_B);
  t.tactic = { ...DOCTRINES[tpl.doctrine].tactic, doctrine: tpl.doctrine };
  t.mainTactic = { ...t.tactic };
  // 11 Kasim: her kademe bir alt kademenin parametrelerini alir (oyun zor geldi); Amator icin yeni, daha yumusak taban.
  // Ek olarak rakip GG kademeye gore kayar (Amator -4 ... Efsane +4): dusuk kademede rakip hem daha yavas karar verir hem daha zayif.
  const DIFF_AI = { 1: { noiseMult: 4, readAcc: 0.2, react: 0.85, timing: 0.3 }, 2: AI_LEVELS[1].ai, 3: AI_LEVELS[2].ai, 4: AI_LEVELS[3].ai, 5: AI_LEVELS[4].ai };
  t.ai = DIFF_AI[diff] || DIFF_AI[2];
  const ggOff = (diff - 3) * 2; for (const p of [...t.players, ...t.bench]) p.gg = Math.max(30, Math.min(99, p.gg + ggOff));
  t.rules = botRules(Math.max(0, diff - 2)); t.think = Math.max(0, diff - 2);
  t.U = 53 + diff * 2; t.T = 46 + diff * 4; t.F = 53 + diff * 2; t.M = 70;
  return t;
}

function saveReplay(st, c) { try { const r = replayOf(st); if (r) { localStorage.setItem('fm.lastReplay', JSON.stringify(r)); CLOUD.verifyMatch(r, c); } } catch (e) { console.error('replay kaydi', e); } }
function loadReplay() { try { return JSON.parse(localStorage.getItem('fm.lastReplay') || 'null'); } catch (e) { return null; } }
function watchLastReplay(c) {
  const r = loadReplay(); if (!r) { toast('Kayıtlı tekrar yok'); return; }
  document.body.classList.remove('app');
  try { FM.watchReplay(r, { cam: APP.db.settings.cam, ball: APP.db.settings.ball, names: APP.db.settings.names, onEnd: () => { document.body.classList.add('app'); render(); }, onExit: () => { document.body.classList.add('app'); render(); } }); }
  catch (e) { console.error(e); try { FM.exit(); } catch (e2) {} document.body.classList.add('app'); render(); toast('Tekrar açılamadı: ' + (e && e.message ? e.message : e)); }
}
function startMatchFlow(c, me, opp, home, instant) {
  const s = APP.db.settings;
  const teams = home ? [me, opp] : [opp, me];
  const side = home ? 0 : 1;
  if (home) me.home = true; else opp.home = true;
  const seed = (c.seed ?? (Date.now() % 1000000)) | 0;
  const finish = (st) => { const rep = buildReport(st, side, c); afterMatch(c, rep); go('report', { rep, c }, false); };
  if (instant) { P.clockRate = 90 / (c.minutes || s.minutes); P.dt = 0.1; P.playSpeed = 1; const st = simulate(teams[0], teams[1], seed); P.clockRate = 6; localStorage.removeItem('fm.lastReplay'); finish(st); return; }
  // sahaya cikmadan once iki takimi dogrula; hata varsa uygulama ekraninda kal ve nedenini goster (eskiden gelistirici sayfasina dusuyordu)
  try { validateTeam(teams[0], teams[0].name); validateTeam(teams[1], teams[1].name); } catch (e) { console.error(e); toast('Maç başlatılamadı: ' + (e && e.message ? e.message : e)); return; }
  document.body.classList.remove('app');
  try {
    FM.startMatch({ teams, side, minutes: c.minutes || s.minutes, keys: s.keys, autoSwitch: s.autoSwitch, assistP: s.assistP, assistS: s.assistS, ball: s.ball, names: s.names, cam: s.cam, mode: s.mode, seed,

    <div class="card"><h3>Görünüm</h3><div class="grid2">
      ${sel('Top boyutu', 'ball', [[1, 'Normal'], [1.4, 'Büyük'], [1.8, 'Çok büyük']])}
      ${sel('Oyuncu isimleri', 'names', [['auto', 'Otomatik'], ['mine', 'Yalnız kontrol ettiğin'], ['off', 'Kapalı']])}
      ${sel('Kamera', 'cam', [['full', 'Tam saha'], ['length', 'Tam boy'], ['near', 'Yakın']])}
      ${sel('Varsayılan oyun modu', 'mode', [['team', 'Team play'], ['sim', 'Total simulation']])}
    </div></div>
    <div class="card"><h3>Tanı <small>hata kaydı</small></h3>${(() => { let e = null; try { e = JSON.parse(localStorage.getItem('fm.lastError') || 'null'); } catch (x) {} return e ? `<p class="muted">${new Date(e.t).toLocaleString('tr-TR')} · ${esc(e.build || '')}</p><pre style="white-space:pre-wrap;word-break:break-word;font-size:11px;background:rgba(0,0,0,.25);padding:8px;border-radius:8px;max-height:180px;overflow:auto">${esc('[' + e.where + '] ' + e.msg)}</pre><div class="row"><button class="btn sm" id="errClr">Kaydı sil</button></div>` : '<p>Kayıtlı hata yok.</p>'; })()}</div>
    <div class="card"><h3>Hesap ve bulut kaydı</h3><p>${esc(APP.db.account?.club.name || '')} · <span id="cloudStatus">${esc(CLOUD.statusText())}</span></p>${authButtons()}<div class="row" style="margin-top:8px">${CLOUD.user ? '<button class="btn sm" id="cloudSync">Şimdi eşitle</button><button class="btn sm ghost" id="cloudOut">Hesap değiştir / çıkış</button>' : ''}<button class="btn ghost" id="reset">Demoyu sıfırla</button><button class="btn ghost" id="devp">Geliştirici sayfası</button></div><p class="muted">Ses, dil, bildirimler, medya izinleri ve hesap silme Faz 3'te.</p></div>
  </div>`, after: () => { for (const el of document.querySelectorAll('.sk')) el.onchange = () => { let v = el.value; if (v === 'true') v = true; else if (v === 'false') v = false; else if (!isNaN(+v) && el.dataset.k !== 'keys') v = +v; APP.db.settings[el.dataset.k] = v; dbSave(); };
    $('reset').onclick = () => { if (confirm('Tüm demo kaydı silinsin mi?')) { localStorage.removeItem(APP.key); location.reload(); } };
    bindAuth(); const cs = $('cloudSync'); if (cs) cs.onclick = async () => { await CLOUD.push(); toast('Eşitlendi'); }; const co = $('cloudOut'); if (co) co.onclick = async () => { if (!confirm('Bu hesaptan çıkılsın mı? Kayıt bulutta kalır.')) return; await CLOUD.signOut(); go('login', {}, false); };
    const ec = $('errClr'); if (ec) ec.onclick = () => { localStorage.removeItem('fm.lastError'); go('settings', {}, false); };
    $('devp').onclick = () => { document.body.classList.remove('app'); location.hash = '#dev'; }; } }; };

// --- baslangic ---
function appInit() {
  dbLoad();
  CLOUD.init();
  if (location.hash === '#dev') return; // gelistirici sayfasi (eski test sayfasi)
  document.body.classList.add('app');
  if (!APP.db.account) go('login', {}, false); else go('home', {}, false);
}
window.addEventListener('hashchange', () => { if (location.hash !== '#dev') { document.body.classList.add('app'); render(); } });
appInit();
